# Test configuration. Any key can be overridden from the command line, e.g.
#   mvn test -Dbrowser=firefox -Dheadless=true
environment=local
browser=chrome
headless=false
windowMaximize=true
# Seconds to wait for elements to appear
explicitWait=15
url=https://www.imdb.com
# Title used by title_display_page.feature (The Shawshank Redemption)
titleId=tt0111161
# IMDB sometimes shows a "confirm you are human" CAPTCHA. The test pauses this many
# seconds for a person to solve it in the browser window.
captchaWaitSeconds=180
# Chrome profile kept between scenarios so a solved CAPTCHA carries over (relative to the project dir)
chromeProfileDir=chrome-profile
